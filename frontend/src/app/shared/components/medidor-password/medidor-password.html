<div class="mt-[0.65rem]">
  <div class="h-[6px] overflow-hidden bg-gray-200">
    <span
      class="block h-full transition-[width,background-color] duration-200"
      [style.width.%]="fortaleza() * 20"
      [class]="
        fortaleza() === 5
          ? 'bg-emerald-600'
          : fortaleza() >= 3
            ? 'bg-accent'
            : 'bg-red-600'
      "
    ></span>
  </div>
  <div class="mt-[0.3rem] flex justify-between text-[0.78rem] font-semibold text-muted">
    <span>Seguridad de la contraseña</span>
    <span>{{ etiqueta() }}</span>
  </div>
</div>

<ul
  class="mt-3 grid grid-cols-[repeat(auto-fit,minmax(180px,1fr))] gap-x-3 gap-y-[0.35rem]"
>
  @for (requisito of requisitos(); track requisito.texto) {
    <li
      class="flex items-center gap-[0.4rem] text-[0.78rem]"
      [class]="requisito.cumple ? 'text-emerald-700' : 'text-muted'"
    >
      <i [class]="'bi ' + (requisito.cumple ? 'bi-check-circle-fill' : 'bi-circle')"></i>
      {{ requisito.texto }}
    </li>
  }
</ul>
