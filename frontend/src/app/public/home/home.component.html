<section class="">
  <img src="/img/hero.webp" alt="Imagen hero" class="block h-screen w-full object-cover">
</section>

<section class="py-12 bg-white">
  <div class="mx-10">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
      <div>
        <h2 class="mt-2 text-black">DESTACADOS</h2>
      </div>
      <a routerLink="/productos" class="inline-flex items-center gap-[0.4rem] font-semibold text-ink hover:text-primary">
        Ver todos <i class="bi bi-arrow-right"></i>
      </a>
    </div>

    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (producto of destacados(); track producto.id) {
        <app-producto-card
          [producto]="producto"
          (agregar)="agregarAlCarrito($event)"
        ></app-producto-card>
      }
    </div>
  </div>
</section>

<section class="py-12 bg-white">
  <div class="container">
    <div class="flex flex-wrap items-center justify-between gap-8 bg-brand p-10 text-white">
      <div>
        <h2 class="mt-[0.7rem] mb-1 text-[clamp(1.6rem,3vw,2.1rem)] text-white">
          SUSCRIBITE A NUESTRO NEWSLETTER
        </h2>
        <p class="max-w-[520px] text-gray-100">
          Novedades y descuentos exclusivos
        </p>
      </div>
      <div class="w-70 bg-transparent border border-white flex items-center">
        <input type="text" class="py-3 px-3 w-full h-full focus:outline-none placeholder:text-white placeholder:text-sm" placeholder="Email">
        <a href="#"><i class="bi bi-arrow-right px-2"></i></a>
      </div>
    </div>
  </div>
</section>
