<nav class="navbar navbar-expand-lg navbar-dark nb-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <span class="brand-mark"><i class="bi bi-stars"></i></span>
      <span>Nébula <span class="brand-store">store</span></span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuPrincipal"
      aria-controls="menuPrincipal"
      aria-expanded="false"
      aria-label="Abrir menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav mx-auto gap-lg-1 my-3 my-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            >Inicio</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos/nuevo" routerLinkActive="active"
            >Publicar producto</a
          >
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        <a routerLink="/carrito" class="btn-carrito" aria-label="Ver carrito">
          <i class="bi bi-bag"></i>
          @if (carrito.cantidadTotal() > 0) {
            <span class="badge-carrito">{{ carrito.cantidadTotal() }}</span>
          }
        </a>

        @if (auth.usuarioActual(); as usuario) {
          <div class="dropdown">
            <button
              class="btn-usuario dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <span class="avatar">{{ usuario.nombre.charAt(0) }}</span>
              <span class="d-none d-xl-inline">{{ usuario.nombre }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end mt-2">
              <li>
                <span class="dropdown-item-text small text-muted">{{ usuario.email }}</span>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <button type="button" class="dropdown-item" (click)="cerrarSesion()">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                </button>
              </li>
            </ul>
          </div>
        } @else {
          <a routerLink="/auth/signin" class="btn btn-nb-outline btn-nb-sm">Ingresar</a>
          <a routerLink="/auth/signup" class="btn btn-nb btn-nb-sm">Crear cuenta</a>
        }
      </div>
    </div>
  </div>
</nav>
