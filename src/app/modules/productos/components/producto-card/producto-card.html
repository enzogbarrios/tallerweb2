<article
  class="flex h-full flex-col overflow-hidden rounded-lg border border-line bg-white transition-colors hover:border-primary"
>
  <a class="relative block overflow-hidden bg-gray-200" [routerLink]="['/productos', producto().id]">
    <img
      class="block aspect-[4/3] w-full object-cover"
      [src]="producto().imagen"
      [alt]="producto().nombre"
      appImagenFallback
      loading="lazy"
    />

    @if (producto().destacado) {
      <span
        class="absolute top-[0.65rem] left-[0.65rem] inline-flex items-center gap-[0.3rem] rounded-sm bg-accent px-[0.55rem] py-1 text-[0.68rem] font-bold tracking-[0.02em] text-white uppercase"
      >
        <i class="bi bi-stars"></i> Destacado
      </span>
    }

    <span
      class="absolute right-[0.65rem] bottom-[0.65rem] inline-flex items-center gap-[0.3rem] rounded-sm bg-ink px-[0.55rem] py-1 text-[0.7rem] font-semibold text-white"
    >
      <i [class]="'bi ' + (producto().clasificacion | clasificacionIcono)"></i>
      {{ producto().clasificacion }}
    </span>
  </a>

  <div class="flex flex-1 flex-col px-[1.05rem] pt-4 pb-[1.05rem]">
    <h3 class="mb-[0.4rem] text-base leading-[1.3]">
      <a class="text-ink hover:text-primary" [routerLink]="['/productos', producto().id]">{{
        producto().nombre
      }}</a>
    </h3>
    <p class="mb-[0.9rem] line-clamp-2 flex-1 text-[0.8rem] leading-normal text-muted">
      {{ producto().descripcion }}
    </p>

    <div class="flex items-center justify-between gap-[0.6rem]">
      <span class="text-[1.05rem] font-bold tracking-tight">{{
        producto().precio | currency: 'ARS' : 'symbol-narrow' : '1.0-0'
      }}</span>

      <button
        type="button"
        class="inline-flex cursor-pointer items-center gap-[0.35rem] rounded-md border px-[0.8rem] py-[0.45rem] text-[0.78rem] font-bold transition-colors"
        [class]="
          agregado()
            ? 'border-emerald-600 bg-emerald-50 text-emerald-700'
            : 'border-primary bg-white text-primary hover:bg-primary hover:text-white'
        "
        [disabled]="agregado()"
        (click)="agregarAlCarrito()"
      >
        @if (agregado()) {
          <i class="bi bi-check2"></i> Agregado
        } @else {
          <i class="bi bi-bag-plus"></i> Agregar
        }
      </button>
    </div>
  </div>
</article>
