<article class="producto-card">
  <a class="producto-imagen" [routerLink]="['/productos', producto().id]">
    <img
      [src]="producto().imagen"
      [alt]="producto().nombre"
      appImagenFallback
      loading="lazy"
    />

    @if (producto().destacado) {
      <span class="etiqueta-destacado"><i class="bi bi-stars"></i> Destacado</span>
    }

    <span class="clasificacion">
      <i [class]="'bi ' + (producto().clasificacion | clasificacionIcono)"></i>
      {{ producto().clasificacion }}
    </span>
  </a>

  <div class="producto-info">
    <h3>
      <a [routerLink]="['/productos', producto().id]">{{ producto().nombre }}</a>
    </h3>
    <p>{{ producto().descripcion }}</p>

    <div class="producto-footer">
      <span class="precio">{{ producto().precio | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}</span>

      <button
        type="button"
        class="btn-agregar"
        [class.agregado]="agregado()"
        [disabled]="agregado()"
        (click)="agregarAlCarrito()"
      >
        @if (agregado()) {
          <i class="bi bi-check2"></i> Agregado
        } @else {
          <i class="bi bi-bag-plus"></i> Agregar
        }
      </button>
    </div>
  </div>
</article>
